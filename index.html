<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雪國轉運站 Snow Country Transit Hub</title>
<meta name="description" content="互動式日本滑雪地區地圖，把散落在部落格、討論串、社團裡的日本滑雪情報整理成一張地圖。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%97%BE</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #F1F5FA;
    --bg-elevated: #FFFFFF;
    --ink: #16213A;
    --ink-soft: #4E5C77;
    --line: #CBD5E3;
    --accent: #1B4F9C;
    --accent-soft: #E5EDFA;
    --amber: #B36A15;
    --amber-soft: #FBEAD2;
    --green: #2C6B47;
    --green-soft: #DFF0E5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .topbar { padding: 20px 32px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .brand-cn { font-weight: 900; font-size: 1.3rem; }
  .brand-en { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
  .subhead { font-size: 0.88rem; color: var(--ink-soft); margin-left: auto; }

  .stage { display: flex; gap: 28px; padding: 28px 32px 40px; align-items: flex-start; flex-wrap: wrap; max-width: 1320px; margin: 0 auto; }

  .map-col { flex: 1 1 480px; max-width: 640px; }
  .map-frame { position: relative; width: 100%; aspect-ratio: 1000 / 665; }
  .map-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }

  .geo-dot { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #EE8A3C; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(180,90,20,0.35), 0 2px 5px rgba(22,33,58,0.25); transform: translate(-50%, -50%); }
  .geo-dot.active { background: #B3551A; }

  .region-card { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-width: 148px; border-radius: 16px; background: var(--bg-elevated); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(22,33,58,0.10); cursor: pointer; text-align: left; font: inherit; }
  .region-card.active { border-color: transparent; box-shadow: 0 6px 18px rgba(27,79,156,0.22), 0 0 0 2px var(--accent); }
  .region-icon { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--green-soft); color: var(--green); display: flex; align-items: center; justify-content: center; }
  .region-card.active .region-icon { background: var(--accent); color: #fff; }
  .region-card-text { display: flex; flex-direction: column; gap: 2px; }
  .region-card-title { font-weight: 700; font-size: 0.88rem; line-height: 1.25; }
  .region-card-sub { font-size: 0.72rem; color: var(--ink-soft); }
  .map-caption { margin-top: 10px; font-size: 0.82rem; color: var(--ink-soft); text-align: center; }

  .panel-col { flex: 1 1 380px; min-width: 320px; }
  .panel { background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 1px 2px rgba(22,33,58,0.06), 0 10px 26px rgba(22,33,58,0.07); padding: 24px 26px; min-height: 480px; }

  .empty-state { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
  .empty-lede { font-size: 1.02rem; max-width: 40ch; text-wrap: balance; }
  .quickpicks { display: flex; flex-wrap: wrap; gap: 8px; }
  .quickpick { padding: 8px 14px; min-height: 44px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 600; font-size: 0.85rem; cursor: pointer; font-family: inherit; color: inherit; }
  .quickpick:hover { border-color: var(--accent); color: var(--accent); }

  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .panel-title { font-size: 1.3rem; font-weight: 800; }
  .panel-desc { font-size: 0.88rem; color: var(--ink-soft); margin-top: 4px; }
  .close-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1rem; cursor: pointer; flex: none; }

  .resort-list { display: flex; flex-direction: column; gap: 16px; margin-top: 18px; }
  .resort-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .resort-name-row { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .resort-name { font-size: 1.06rem; font-weight: 700; }
  .resort-romaji { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 0.68rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
  .resort-meta { font-size: 0.82rem; color: var(--ink-soft); margin-top: 3px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 0.73rem; font-weight: 500; }
  .tag.default { background: var(--accent-soft); color: var(--accent); }
  .tag.family { background: var(--green-soft); color: var(--green); }
  .tag.onsen { background: var(--amber-soft); color: var(--amber); }
  .access-row { font-size: 0.8rem; color: var(--ink-soft); margin-top: 10px; }
  .access-value { font-family: 'IBM Plex Mono', monospace; color: var(--ink); }
  .divider { height: 1px; background: var(--line); margin: 12px 0 10px; }
  .links-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.09em; color: var(--ink-soft); text-transform: uppercase; }
  .link-list { list-style: none; margin: 8px 0 0; padding: 0; }
  .link-list li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .link-list li:last-child { border-bottom: none; }
  .link-list a { display: flex; justify-content: space-between; gap: 10px; font-weight: 500; font-size: 0.88rem; text-decoration: none; color: var(--accent); }
  .link-list a:hover { text-decoration: underline; }
  .link-source { display: block; font-size: 0.72rem; color: var(--ink-soft); margin-top: 1px; }

  .site-footer { padding: 0 32px 40px; max-width: 1320px; margin: 0 auto; }
  .site-footer p { max-width: 62ch; font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 8px; }

  @media (max-width: 760px) {
    .stage { flex-direction: column; }
  }
</style>
</head>

var MOUNTAIN_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18L14.5 8.5 11 13l-2.5-3L3 19z"></path><circle cx="17.5" cy="6.5" r="1.8"></circle></svg>';

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function classifyTag(t){
  if (t.indexOf('親子')>-1 || t.indexOf('新手')>-1 || t.indexOf('友善')>-1) return { text: t, cls: 'family' };
  if (t.indexOf('溫泉')>-1) return { text: '♨ ' + t, cls: 'onsen' };
  return { text: t, cls: 'default' };
}

var selected = null;
var dotsEl = document.getElementById('dots');
var cardsEl = document.getElementById('cards');
var panelEl = document.getElementById('panel');

function select(id){ selected = id; render(); }

function render(){
  var dotsHtml = '';
  var cardsHtml = '';
  Object.keys(DOTS).forEach(function(id){
    var d = DOTS[id];
    var active = selected === id ? ' active' : '';
    dotsHtml += '<div class="geo-dot' + active + '" style="left:' + d[0] + '%;top:' + d[1] + '%"></div>';
    var c = CARDS[id];
    var r = REGIONS[id];
    cardsHtml += '<button class="region-card' + active + '" style="left:' + c[0] + '%;top:' + c[1] + '%" data-id="' + id + '">' +
      '<span class="region-icon">' + MOUNTAIN_SVG + '</span>' +
      '<span class="region-card-text"><span class="region-card-title">' + esc(r.name) + '</span><span class="region-card-sub">' + esc(r.sub) + '</span></span>' +
      '</button>';
  });
  dotsEl.innerHTML = dotsHtml;
  cardsEl.innerHTML = cardsHtml;
  document.querySelectorAll('.region-card').forEach(function(btn){
    btn.addEventListener('click', function(){ select(btn.getAttribute('data-id')); });
  });

  if (!selected) {
    var qp = Object.keys(REGIONS).map(function(id){
      return '<button class="quickpick" data-id="' + id + '">' + esc(REGIONS[id].name) + '</button>';
    }).join('');
    panelEl.innerHTML = '<div class="empty-state">' +
      '<div class="empty-lede">把散落在部落格、討論串、社團裡的日本滑雪情報，依地區整理成一張地圖。點選左邊地圖上的任一區域，看看有哪些雪場、誰寫過心得。</div>' +
      '<div class="quickpicks">' + qp + '</div></div>';
    panelEl.querySelectorAll('.quickpick').forEach(function(btn){
      btn.addEventListener('click', function(){ select(btn.getAttribute('data-id')); });
    });
    return;
  }

  var region = REGIONS[selected];
  var cardsListHtml = region.resorts.map(function(resort){
    var tagsHtml = resort.tags.map(classifyTag).map(function(t){
      return '<span class="tag ' + t.cls + '">' + esc(t.text) + '</span>';
    }).join('');
    var linksHtml = resort.links.map(function(l){
      return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer"><span>' + esc(l.title) + '</span><span>↗</span></a><span class="link-source">' + esc(l.source) + '</span></li>';
    }).join('');
    return '<div class="resort-card">' +
      '<div class="resort-name-row"><span class="resort-name">' + esc(resort.name) + '</span><span class="resort-romaji">' + esc(resort.romaji) + '</span></div>' +
      '<div class="resort-meta">' + esc(resort.prefecture) + '　·　' + esc(resort.tagline) + '</div>' +
      '<div class="tag-row">' + tagsHtml + '</div>' +
      '<div class="access-row">交通　<span class="access-value">' + esc(resort.access) + '</span></div>' +
      '<div class="divider"></div>' +
      '<div class="links-label">延伸閱讀</div>' +
      '<ul class="link-list">' + linksHtml + '</ul>' +
      '</div>';
  }).join('');

  panelEl.innerHTML = '<div class="panel-head">' +
    '<div><div class="panel-title">' + esc(region.name) + '</div><div class="panel-desc">' + esc(region.desc) + '</div></div>' +
    '<button class="close-btn" id="closeBtn" aria-label="關閉">✕</button></div>' +
    '<div class="resort-list">' + cardsListHtml + '</div>';
  document.getElementById('closeBtn').addEventListener('click', function(){ select(null); });
}

render();
</script>
